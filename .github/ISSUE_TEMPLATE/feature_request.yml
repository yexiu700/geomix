name: Feature / Refactor Request
description: Propose a new capability, UX enhancement, or architectural refactor
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: dropdown
    id: area
    attributes:
      label: Target Area
      options:
        - Action Home & Workspace Shell (/home, Brand/Market Switcher)
        - Brand Assets (Brands / Dual-Market / Fact Cards / Media Gallery)
        - AI Visibility Diagnostics & Radar (/visibility)
        - GEO Brief Engine (Diagnosis-to-Brief / Competitor Counter)
        - GEO Content Studio & Delivery (/studio, SSE, Batch, Evaluator, Export, Retest)
        - Account, Auth, Billing & Admin Console (/account, /admin)
        - Architecture / Refactor / Tooling / E2E
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What user workflow or engineering pain point does this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Outline the expected UX, API/DB changes, or module design.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Measurable conditions that verify the work is complete.
      placeholder: |
        - [ ] ...
        - [ ] Unit tests / E2E coverage added
    validations:
      required: false

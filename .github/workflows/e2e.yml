name: E2E

on:
  workflow_call:
  workflow_dispatch:

jobs:
  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: geomix
          POSTGRES_PASSWORD: geomix
          POSTGRES_DB: geomix
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U geomix -d geomix"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://geomix:geomix@127.0.0.1:5432/geomix?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: e2e-ci-access-secret-value
      JWT_REFRESH_SECRET: e2e-ci-refresh-secret-value
      BILLING_MODE: SHADOW
      LLM_PROVIDERS: '{}'
      EMBEDDING_PROVIDER: fake
      IMAGE_PROVIDER: fake
      VISIBILITY_COLLECTOR: fake
      STORAGE_DRIVER: memory
      SEARCH_PROVIDER: link_list
      FEATURE_AI_IMAGE: 'true'
      FEATURE_VISIBILITY: 'true'
      CREDENTIAL_ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_BASE: http://127.0.0.1:3001/api/v1
      NEXT_E2E_FAST_BUILD: '1'
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_API_BASE: http://127.0.0.1:3001/api/v1
      E2E_PUBLIC_FIXTURE_HOST: public.e2e.example
      E2E_FIXTURE_PORT: '3099'
      E2E_V2: '1'
      AUTH_CAPTCHA_MAX: '100'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          node packages/db/scripts/prisma-cli.mjs generate

      - name: Cache Turborepo and Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: ${{ runner.os }}-turbo-e2e-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-e2e-

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          PW_VERSION=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          echo "version=${PW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Ensure Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          NEEDS_DEPS=0
          mapfile -t BINS < <(find ~/.cache/ms-playwright -maxdepth 4 -type f \( -name "headless_shell" -o -name "chrome" \) 2>/dev/null)
          if [ "${#BINS[@]}" -eq 0 ]; then
            NEEDS_DEPS=1
          else
            for BIN in "${BINS[@]}"; do
              if ldd "$BIN" 2>/dev/null | grep -q "not found"; then
                NEEDS_DEPS=1
                break
              fi
            done
          fi
          if [ "$NEEDS_DEPS" -eq 1 ]; then
            pnpm exec playwright install-deps chromium
          else
            echo "All Chromium shared libraries are already satisfied on runner; skipping apt-get."
          fi

      - name: Build apps and prepare database
        run: |
          node packages/db/scripts/prisma-cli.mjs migrate deploy &
          MIGRATE_PID=$!
          pnpm build
          wait "$MIGRATE_PID"
          node packages/db/dist/seed-cli.js

      - name: Run Playwright end-to-end suite
        run: pnpm test:e2e

      - name: Upload Playwright report and GeoMix screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            playwright-report/
            test-results/
          compression-level: 1
          retention-days: 14

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build and deploy'
        required: false
        type: string
        default: 'main'

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Set image metadata
        id: meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          HEAD_SHA=$(git rev-parse --short=7 HEAD)
          echo "owner=${OWNER_LOWER}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE=${{ vars.NEXT_PUBLIC_API_BASE || '/api/v1' }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/geomix-web:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/geomix-web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/geomix-server:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/geomix-server:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  deploy:
    name: Deploy to Server (Self-Hosted)
    needs: build-and-push
    runs-on: self-hosted
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout compose files
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
          clean: true

      - name: Sync compose files & deploy
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/geomix' }}
          GHCR_OWNER: ${{ needs.build-and-push.outputs.owner }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.tag }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$DEPLOY_PATH/docker/postgres/init"
          cp -f docker-compose.prod.yml "$DEPLOY_PATH/docker-compose.prod.yml"
          cp -rf docker/postgres/init/. "$DEPLOY_PATH/docker/postgres/init/"

          cd "$DEPLOY_PATH"
          if [ ! -f .env ]; then
            echo "ERROR: $DEPLOY_PATH/.env not found. Please create it before deploying."
            exit 1
          fi

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          export GHCR_OWNER
          export IMAGE_TAG
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f --filter "until=168h" || true
